<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10111c">
  <meta name="description" content="A little hello from the web.">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #b8b6ca;
      --glass: rgba(255, 255, 255, .075);
      --line: rgba(255, 255, 255, .14);
      --violet: #b09aff;
      --mint: #91f4d2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 28px;
      color: var(--ink);
      background: #10111c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before, body::after {
      position: fixed;
      z-index: -1;
      content: "";
      width: min(58vw, 720px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .36;
      animation: drift 15s ease-in-out infinite alternate;
    }
    body::before { background: #7052eb; top: -34%; left: -18%; }
    body::after { background: #187c84; bottom: -45%; right: -14%; animation-delay: -7s; }
    .grain {
      position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .13;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");
    }
    .card {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(34px, 7vw, 76px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 32px 100px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(22px);
      animation: arrive .8s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 10px;
      margin: 0 0 28px; color: var(--mint); font-size: .76rem;
      font-weight: 700; letter-spacing: .17em; text-transform: uppercase;
    }
    .spark { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 16px var(--mint); }
    h1 {
      margin: 0; font-size: clamp(3.5rem, 10vw, 7.6rem); line-height: .96;
      letter-spacing: -.075em; font-weight: 760;
    }
    h1 span {
      display: block; color: transparent;
      background: linear-gradient(100deg, #c9b7ff 8%, #9fdfff 53%, #a5f5d9 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .intro { max-width: 470px; margin: 28px 0 0; color: var(--muted); font-size: clamp(1rem, 2.2vw, 1.15rem); line-height: 1.75; }
    .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 18px; margin-top: 38px; }
    button {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 21px;
      color: #171421; background: linear-gradient(105deg, #c6b4ff, #9df1d6);
      font: inherit; font-weight: 750; cursor: pointer;
      box-shadow: 0 8px 28px rgba(158, 220, 219, .17);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(158, 220, 219, .28); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .hint { color: #8f8da2; font-size: .88rem; }
    .footer { display: flex; justify-content: space-between; gap: 14px; margin-top: 64px; padding-top: 19px; border-top: 1px solid rgba(255,255,255,.11); color: #9694a9; font-size: .78rem; letter-spacing: .04em; }
    .footer span:last-child { color: #c3bfd5; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px); padding: 12px 18px; border: 1px solid var(--line); border-radius: 99px; background: rgba(24,24,38,.86); color: var(--ink); opacity: 0; transition: .25s ease; pointer-events: none; box-shadow: 0 10px 32px #0005; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(9%, 8%) scale(1.12); } }
    @media (max-width: 520px) { body { padding: 18px; } .card { border-radius: 24px; } .footer { margin-top: 46px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="card">
    <p class="eyebrow"><span class="spark" aria-hidden="true"></span> A small beginning</p>
    <h1>Hello,<span>world!</span></h1>
    <p class="intro">A little page with a lot of possibility. Here’s to the first line of something wonderful.</p>
    <div class="actions">
      <button id="helloButton" type="button">Say hello <span aria-hidden="true">↗</span></button>
      <span class="hint">Go on, give it a click.</span>
    </div>
    <footer class="footer"><span>MADE WITH CURIOSITY</span><span>01 / ∞</span></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite">Hello right back at you ✨</div>
  <script>
    const button = document.querySelector('#helloButton');
    const toast = document.querySelector('#toast');
    let toastTimer;
    button.addEventListener('click', () => {
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    });
  </script>
</body>
</html>
